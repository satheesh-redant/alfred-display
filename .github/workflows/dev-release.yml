name: Build & Release for internal testing

on:
  push:
    tags:
      - "v*"

jobs:
  build_and_release:
    runs-on: ubuntu-22.04

    defaults:
      run:
        shell: bash

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          channel: stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Build Linux app
        run: | 
          flutter pub get
          flutter build linux --release
      
      - name: Create release archive
        id: package
        run: |
          set -e
          cd build/linux/x64/release
          TAG="${GITHUB_REF#refs/tags/}"
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          OUT="alfred-helios-${TAG}-${TIMESTAMP}.tar.gz"
          if [ ! -d bundle ]; then
            echo "ERROR: bundle/ folder not found. Did the build produce an bundle/ folder?" >&2
            exit 2
          fi
          tar -czf "$OUT" bundle/
          echo "tarball=$OUT" >> $GITHUB_OUTPUT

      - name: Create checksum (SHA256)
        id: checksum
        run: |
          set -e
          cd build/linux/x64/release
          TARBALL="${{ steps.package.outputs.tarball }}"
          if [ -z "$TARBALL" ]; then
            TARBALL=$(ls alfred-helios-*.tar.gz | head -n1)
          fi
          sha256sum "$TARBALL" | awk '{print $1"  "$2}' > "${TARBALL}.sha256"
          echo "checksum_file=${TARBALL}.sha256" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          mode: "COMMIT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if pre-release
        id: check_prerelease
        run: |
          if [[ "${{ github.ref_name }}" =~ (alpha|beta|rc|pre) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ steps.check_prerelease.outputs.is_prerelease }}
          body: ${{ steps.changelog.outputs.changelog }}
          files: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.checksum.outputs.checksum_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
