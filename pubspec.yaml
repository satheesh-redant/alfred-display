name: alfred
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  slang: ^4.6.0
  slang_flutter: ^4.6.0
  flutter_localizations: # add this
    sdk: flutter

  go_router: ^14.8.1
  flutter_riverpod: ^2.6.1
  dotted_border: ^3.1.0
  rosbridge: ^0.0.3-dev+4
  path_provider: ^2.1.5
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.7
  toastification: ^3.0.2
  loader_overlay: ^5.0.0
  intl: any
  window_manager: ^0.4.3
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.15
  slang_build_runner: ^4.6.0

  flutter_lints: ^5.0.0

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true

  assets:
    - assets/images/           # Add your images here (e.g. dummy_logo.png, waiter.png)
    - assets/i18n/    # localization JSON files
    - assets/google_fonts/
